name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
# Cancel only superseded PR validations; main's trusted deploy signal must never be canceled.
concurrency:
  group: cloud-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: kicad_cloud_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d kicad_cloud_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://test:test@127.0.0.1:5432/kicad_cloud_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Validate production operational scripts
        run: |
          node --check scripts/production-smoke.mjs
          bash -n scripts/production-backup.sh
          bash -n scripts/production-restore-drill.sh
          bash -n scripts/offsite-restore-verify.sh
          bash -n scripts/offsite-backup-push.sh
          bash -n scripts/install-offsite-backup-timer.sh
          bash -n scripts/offsite-restore-verify.sh
          bash -n scripts/offsite-backup-push.sh
          bash -n scripts/production-deploy-if-ready.sh
          bash -n scripts/doppler-runtime.sh
          bash -n scripts/setup-vps-doppler.sh
          bash -n scripts/bootstrap-production-vps.sh
          bash -n scripts/test-portable-bootstrap.sh
          node --check scripts/portable-config.mjs
          node --check scripts/verify-bootstrap-pr.mjs
          bash -n scripts/install-production-deploy-timer.sh
          bash -n scripts/test-release-watcher-guards.sh
          node --check scripts/production-browser-smoke.mjs
          node --check scripts/ui-visual-smoke.mjs
          if bash scripts/production-restore-drill.sh --invalid >/dev/null 2>&1; then
            echo "Restore drill accepted an unsupported action" >&2
            exit 1
          fi
      - name: Verify Doppler-only offsite backup timer contracts (offline fixtures)
        run: node --test scripts/test-offsite-scheduler.mjs
      - name: Validate production Compose topology and healthcheck
        run: node scripts/check-production-compose.mjs
      - name: Verify portable Doppler deployment contracts (offline fixtures)
        run: |
          node --test scripts/test-portable-deployment.mjs
          node --test scripts/test-bootstrap-pr.mjs
          bash scripts/test-portable-bootstrap.sh
      - name: Verify release watcher cutover and reboot guards (isolated mocks)
        run: bash scripts/test-release-watcher-guards.sh
      - name: Verify isolated ingress candidate only (offline, synthetic secrets)
        run: |
          node scripts/check-ingress-candidate.mjs
          node --test scripts/test-ingress-candidate.mjs
      - name: Validate offline Cloudflare edge release requirements
        run: node --test scripts/test-cloudflare-edge.mjs
      - name: Validate Cloudflare Free edge Worker candidate offline
        run: node --test scripts/test-edge-worker-candidate.mjs
      - name: Build and verify minimal production OCI image
        run: |
          docker build -t kicad-mcp-pro-cloud:ci .
          docker run --rm --network none --entrypoint /bin/sh kicad-mcp-pro-cloud:ci -ec '
            test "$(id -u)" -eq 1000
            command -v node >/dev/null
            test -f dist/main.js
            test -d node_modules
            test ! -d /usr/local/lib/node_modules/npm
            for manager in npm npx corepack yarn yarnpkg; do
              if command -v "$manager" >/dev/null 2>&1; then
                echo "Unexpected package manager in production runtime: $manager" >&2
                exit 1
              fi
            done
          '
      - name: Prove ephemeral PostgreSQL backup and restore
        run: bash scripts/ci-db-restore-drill.sh kicad-mcp-pro-cloud:ci
