name: Production Deployment
on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]
permissions:
  contents: read
concurrency:
  group: kicad-cloud-production
  cancel-in-progress: false
jobs:
  production:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment:
      name: production
    env:
      EXPECTED_REVISION: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Ensure tested revision is still current main
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          current=$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq '.sha')
          if [[ "$EXPECTED_REVISION" != "$current" ]]; then
            echo 'superseded=true' >> "$GITHUB_OUTPUT"
            echo 'Skipping superseded release; newer main must pass CI.'
          else
            echo 'superseded=false' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.version.outputs.superseded == 'false'
        with:
          persist-credentials: false
      - name: Verify checked-out trusted main revision
        if: steps.version.outputs.superseded == 'false'
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_REVISION"
      - uses: actions/setup-node@v4
        if: steps.version.outputs.superseded == 'false'
        with:
          node-version: '24'
      - name: Install official Doppler CLI
        if: steps.version.outputs.superseded == 'false'
        uses: dopplerhq/cli-action@4819d808ab99e5cde19a0637a16536a4038fad73 # v4 pinned
      - name: Resolve production HTTPS origin from Doppler
        id: destination
        if: steps.version.outputs.superseded == 'false'
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$DOPPLER_TOKEN" || { echo 'Production-scoped Doppler service token required'; exit 1; }
          origin=$(doppler run -- node scripts/portable-config.mjs origin)
          google=$(doppler run -- node scripts/portable-config.mjs google)
          echo "origin=$origin" >> "$GITHUB_OUTPUT"
          echo "google=$google" >> "$GITHUB_OUTPUT"
      - name: Await VPS release and verify exact revision
        if: steps.version.outputs.superseded == 'false'
        env:
          PUBLIC_ORIGIN: ${{ steps.destination.outputs.origin }}
        run: |
          set -euo pipefail
          # The dedicated VPS timer reads this same successful main CI run,
          # builds locally, and deploys with a single-image rollback.
          for attempt in $(seq 1 40); do
            if curl --fail --silent --show-error --max-time 10 --retry 0 \
              --output "$RUNNER_TEMP/kicad-cloud-health.json" \
              "${PUBLIC_ORIGIN}/health"; then
              live=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1])).get("revision","unknown"))' \
                "$RUNNER_TEMP/kicad-cloud-health.json") || live=unreachable
            else
              live=unreachable
            fi
            if [[ "$live" == "$EXPECTED_REVISION" ]]; then
              echo "Deployed exact CI-verified revision $EXPECTED_REVISION";
              exit 0
            fi
            echo "Deployment awaiting VPS watcher (attempt ${attempt}/40)."
            sleep 15
          done
          echo 'Deployment not verified; production job fails closed.' >&2
          exit 1
      - name: Install Chromium for real first-party login acceptance
        if: steps.version.outputs.superseded == 'false'
        run: |
          npm ci --ignore-scripts
          ./node_modules/.bin/playwright install --with-deps chromium
      - name: Independent public production smoke
        if: steps.version.outputs.superseded == 'false'
        env:
          PUBLIC_ORIGIN: ${{ steps.destination.outputs.origin }}
          EXPECTED_GOOGLE_OAUTH: ${{ steps.destination.outputs.google }}
        run: node scripts/production-smoke.mjs
      - name: Native Chromium GitHub login form acceptance
        if: steps.version.outputs.superseded == 'false'
        env:
          PUBLIC_ORIGIN: ${{ steps.destination.outputs.origin }}
        run: node scripts/production-browser-smoke.mjs
      - name: Responsive workspace UX acceptance
        if: steps.version.outputs.superseded == 'false'
        run: |
          # This workflow checks out a fresh source tree; compiled UI is not cached.
          npm run build
          node scripts/ui-visual-smoke.mjs
