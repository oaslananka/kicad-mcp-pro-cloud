name: kicad-cloud
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: kicad_cloud
      POSTGRES_USER: kicad_cloud
      POSTGRES_PASSWORD: ${KICAD_DB_PASSWORD:?Required Doppler value}
    volumes:
      - production_database:/var/lib/postgresql/data
    networks:
      - database
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kicad_cloud -d kicad_cloud"]
      interval: 10s
      timeout: 5s
      retries: 10
    security_opt:
      - no-new-privileges:true
  app:
    image: kicad-mcp-pro-cloud:production
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?Required Doppler value}
      OAUTH_ISSUER: ${OAUTH_ISSUER:?Required Doppler value}
      OAUTH_JWKS_URL: ${OAUTH_JWKS_URL:?Required Doppler value}
      OAUTH_AUDIENCE: ${OAUTH_AUDIENCE:?Required Doppler value}
      DATABASE_URL: postgresql://kicad_cloud@db:5432/kicad_cloud
      PGPASSWORD: ${KICAD_DB_PASSWORD:?Required Doppler value}
      AUTH_MODE: external
      HOST: 0.0.0.0
      PORT: "8787"
      NODE_ENV: production
    networks:
      - database
      - tunnel
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=32m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          require('node:http').get({hostname:'127.0.0.1',port:8787,
          path:'/health',headers:{host:new URL(process.env.PUBLIC_ORIGIN).host}},
          r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
volumes:
  production_database:
networks:
  database:
    internal: true
  tunnel:
    external: true
    name: ops_internal
