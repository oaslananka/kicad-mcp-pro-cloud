name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: kicad_cloud_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d kicad_cloud_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://test:test@127.0.0.1:5432/kicad_cloud_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Validate production Compose topology and healthcheck
        run: node scripts/check-production-compose.mjs
      - name: Build secret-free OCI image
        run: docker build -t kicad-mcp-pro-cloud:ci .
      - name: Prove ephemeral PostgreSQL backup and restore
        run: bash scripts/ci-db-restore-drill.sh kicad-mcp-pro-cloud:ci
