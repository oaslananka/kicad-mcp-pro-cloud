name: CodSpeed
# Benchmarks are opt-in only. PR/merge CI focuses on build, tests, and security.
# Runners fluctuate and unrelated benchmarks must not block the first login.
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write # OpenID Connect authentication with CodSpeed
jobs:
  benchmarks:
    name: Run benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Run benchmarks
        uses: CodSpeedHQ/action@v5
        with:
          mode: simulation
          run: npm run bench
